name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Callable so the availability sync can deploy the commit it just pushed.
  # A push made with GITHUB_TOKEN does not start a new workflow run, so this
  # cannot be left to the push trigger above.
  workflow_call:
    inputs:
      ref:
        description: Commit to build. Defaults to the triggering commit.
        type: string
        required: false
        default: ""

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that's mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/configure-pages@v5
        id: pages

      # base_path is "/<repo>" for a project site, and "" for a user site or a
      # custom domain. configure-pages works it out from the Pages settings.
      - name: Build static site
        run: bun scripts/build-static.ts
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
