<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="2120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c2c47"/>
      <stop offset="100%" stop-color="#5c1428"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- The house number, stacked two over two. Four digits across a 16px tab
       would be two pixels each; in two rows they still read. -->
  <g fill="#ffffff" text-anchor="middle"
     font-family="'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif"
     font-size="27" letter-spacing="-1">
    <text x="32" y="30">21</text>
    <text x="32" y="53">20</text>
  </g>
</svg>
